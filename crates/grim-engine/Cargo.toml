[package]
name = "grim-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Grim inference engine runtime. Wires the scheduler, memory manager, model registry, and executor into a single `Engine` struct."

[dependencies]
grim-tensor = { workspace = true }
grim-core = { workspace = true }
grim-nn = { workspace = true }
grim-backend-cpu = { workspace = true }
grim-backend-rocm = { workspace = true }
grim-backend-cuda = { workspace = true, optional = true }
grim-backend-metal = { workspace = true, optional = true }
grim-memory = { workspace = true }
grim-scheduler = { workspace = true }
grim-models-transformer = { workspace = true }
grim-models-mamba = { workspace = true }
grim-models-vision = { workspace = true }
grim-models-audio = { workspace = true }
grim-models-diffusion = { workspace = true }
grim-format = { workspace = true }
grim-speculative = { workspace = true }
grim-kvquant = { workspace = true }
grim-autograd = { workspace = true }
grim-plugin = { workspace = true }
grim-disagg = { workspace = true }
grim-kvtransport = { workspace = true }
log = "0.4"
tracing = "0.1"
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
grim-quant = { workspace = true }

[features]
default = ["rocm"]
rocm = ["grim-backend-rocm/rocm"]
cuda = ["dep:grim-backend-cuda", "grim-nn/cuda-mem", "grim-autograd/cuda-mem"]
# Phase 7 item 1: Metal probe (model_loader fallback) is opt-in, mirroring
# `cuda`. Forwards to the nn/autograd `metal-mem` dispatch arms so the
# Device::Metal paths exist whenever engine's metal probe is compiled.
metal = ["dep:grim-backend-metal", "grim-nn/metal-mem", "grim-autograd/metal-mem"]
rocm-mem = []

[[bench]]
name = "scythe2_decide_miss"
harness = false

[lints]
workspace = true
