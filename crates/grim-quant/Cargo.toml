[package]
name = "grim-quant"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["rocm-mem"]
rocm-mem = []
rocm = ["rocm-mem"]

[dependencies]
grim-tensor = { workspace = true }
rayon = "1.12"

[lib]
name = "grim_quant"
path = "src/lib.rs"

[[test]]
name = "scan_q4k_dtypes"
path = "tests/scan_q4k_dtypes.rs"

[[test]]
name = "mxfp4_gemm_tests"
path = "tests/mxfp4_gemm_tests.rs"

[[test]]
name = "mxfp4_framed_matmul"
path = "tests/mxfp4_framed_matmul.rs"

[dev-dependencies]
grim-format = { workspace = true }
grim-nn = { workspace = true, features = ["rocm-mem"] }
grim-backend-rocm = { workspace = true }
grim-tensor = { workspace = true }
