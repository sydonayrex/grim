[package]
name = "grim-quant"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["rocm-mem"]
rocm-mem = []
rocm = ["rocm-mem"]

[dependencies]
grim-tensor = { workspace = true }
rayon = "1.12"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[lib]
name = "grim_quant"
path = "src/lib.rs"

[dev-dependencies]
grim-format = { workspace = true }
grim-nn = { workspace = true, features = ["rocm-mem"] }
grim-backend-rocm = { workspace = true }
grim-tensor = { workspace = true }

[lints]
workspace = true
