[package]
name = "grim-autograd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Scoped autograd for adapter-only backward pass (LoRA / QLoRA) — minimal reverse-mode tape over the trainable path only."

[dependencies]
grim-tensor = { workspace = true }
grim-format = { workspace = true }
grim-backend-cpu = { workspace = true }
grim-backend-rocm = { workspace = true, features = ["rccl"] }
grim-backend-cuda = { workspace = true, optional = true }
grim-backend-metal = { workspace = true }
grim-backend-vulkan = { workspace = true }
grim-quant = { workspace = true }
serde = { version = "1", features = ["derive"] }

[features]
default = ["rocm-mem", "metal-mem", "vulkan-mem"]
cuda-mem = ["dep:grim-backend-cuda"]
rocm-mem = []
metal-mem = []
vulkan-mem = []
# grim-garage's gpu-selection feature turns on every GPU backend arm.
gpu-selection = ["cuda-mem", "rocm-mem", "metal-mem", "vulkan-mem"]

[dev-dependencies]
grim-quant = { workspace = true }

