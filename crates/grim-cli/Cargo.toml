[package]
name = "grim-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Grim CLI — run, bench, quantize, plugin management."

[[bin]]
name = "grim-cli"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
grim-tensor = { workspace = true }
grim-core = { workspace = true }
grim-engine = { workspace = true }
grim-server = { workspace = true }
grim-disagg = { workspace = true }
grim-memory = { workspace = true }
grim-models-transformer = { workspace = true }
grim-models-mamba       = { workspace = true }
grim-backend-cpu = { workspace = true }
grim-backend-rocm = { workspace = true }
grim-backend-cuda = { workspace = true, optional = true }
grim-backend-vulkan = { workspace = true }
grim-backend-metal = { workspace = true, optional = true }
grim-speculative = { workspace = true }
grim-plugin = { workspace = true }
grim-format = { workspace = true }
    grim-quant = { workspace = true }
    grim-nn = { workspace = true }
    grim-autograd = { workspace = true }
    grim-garage = { workspace = true }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
windows-service = "0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rcgen = "0.12"
reqwest = { version = "0.12", features = ["json", "stream"] }
sha2 = "0.10"
zstd = "0.13"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
rand = { workspace = true }
ratatui = "0.30"
crossterm = "0.28"
pulldown-cmark = "0.12"
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy", "plist-load"] }
toml = "0.8"
# Safely redirect stderr to a log file during TUI model loading so
# backend debug output doesn't corrupt the raw-mode terminal display.
gag = "1.0"
arboard = "3"
base64 = "0.22"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[features]
# ROCm only by default. CUDA and Metal are optional — enable with
# --features cuda or --features metal. This avoids requiring the CUDA
# toolkit/SDK at build time for ROCm-only hosts.
default = ["rocm"]
rocm = ["grim-backend-rocm/cubecl"]
cuda = ["dep:grim-backend-cuda", "grim-engine/cuda"]
metal = ["dep:grim-backend-metal"]
wasm-sandbox = ["grim-plugin/wasm-sandbox"]

[lints]
workspace = true
