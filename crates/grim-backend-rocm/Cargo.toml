[package]
name = "grim-backend-rocm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ROCm (hip/rocBLAS) backend for Grim — primary GPU target per architecture §4."

[dependencies]
grim-tensor = { workspace = true }
grim-backend-cpu = { workspace = true }
grim-format = { workspace = true }
grim-quant = { workspace = true }
grim-core = { workspace = true }
grim-memory = { workspace = true }
thiserror = { workspace = true }
log = "0.4"
half = "2.0"
seahash = "4.1"
lazy_static = "1.4"
temp-env = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Dynamic loading for MIOpen (grim-sonnet F9): the lib may be absent at
# link time (no real libMIOpen.so in this env), so we dlopen it at runtime
# via libloading and error cleanly if missing — never panic (rust-gpu-discipline §2 #12).
libloading = "0.8"
libc = "0.2"
# NOTE: umbrella WITHOUT `hip` — the HIP runtime is grim's fork
# (`grim-cl-hip` below), not the registry `cubecl-hip` the umbrella's
# `hip` feature would pull. See crates/grim-cl-hip/PROVENANCE.md.
cubecl = { version = "0.10.0", optional = true }
grim-cl-hip = { path = "../grim-cl-hip", optional = true }
# Vendored HIP bindings (from cubecl-hip-sys) — see crates/grim-hip-sys/PROVENANCE.md.
grim-hip-sys = { path = "../grim-hip-sys" }
# Force cubecl-runtime's `std` feature on so its `std_io` cfg is active, which
# compiles the on-disk kernel compilation cache (`cubecl::config::CacheConfig`).
# Without this, `grim-cl-hip`'s `cubecl-runtime` dep (default-features = false) keeps
# `std` off and the cache module is cfg'd out.
cubecl-runtime = { version = "0.10.0", features = ["std"], optional = true }

[build-dependencies]
# rocm-rs = { git = "https://github.com/RustNSparks/rocm-rs", rev = "master" }
cc = "1.0"

[features]
# Phase 7 item 1: cubecl (pure-Rust HIP JIT) is PARITY/TEST config — the
# shipping path is the hipRTC source in `kernels/`. Shipping two JIT
# toolchains in the default build is test config, not ship config, so
# `cubecl` is out of `default`; reach it through `parity-tests`
# (grim-cli/README: `cargo test -p grim-backend-rocm --features parity-tests`).
# q4k/q5k/q6k MUST ship enabled: their fused-GEMM kernels only enter the
# aggregate JIT unit under these gates, and KQuant GGUF models (Q4_K/Q6_K are
# the dominant formats) hit hipModuleGetFunction error 500 at first forward
# without them — the same failure class previously fixed for grim_dequant_q4k.
# q2k/q3k joined the default set for the same reason: dispatch routes
# KQuantScheme::Q2K/Q3K unconditionally to launch_fused_dequant_gemm_q2k/q3k,
# so a non-default build crashes any Q2_K/Q3_K model at first forward.
default = ["jit-hw-adaptive", "q2k", "q3k", "q4k", "q5k", "q6k"]
rocm = []
jit-hw-adaptive = ["rocm"]
multi-gpu-kernel = ["rocm"]
# SPEED-ROC-5: one switch for multi-GPU training/inference builds. Pulls in
# RCCL so cross-GPU collectives run on-device instead of falling back to the
# host-staging ring (D2H -> CPU sum -> H2D) in ParallelCommunicator.
multi-gpu = ["multi-gpu-kernel", "rccl"]
rocm-profile = ["rocm"]
ncu = []

rocm-aiter = ["rocm"]
# grim-sonnet F8 — Composable Kernel (ck_tile) GEMM used to expose a
# `ck` cargo feature that built src/device/ck_gemm.cpp + a C FFI surface
# against the vendored CK headers. grim is Rust-centric now: the
# decode-GEMM kernel is an embedded HIP source literal in
# `kernels::decode_gemm::KERNEL_SOURCE`, JIT-compiled at runtime.
cubecl = ["dep:cubecl", "dep:grim-cl-hip", "dep:cubecl-runtime", "rocm"]
# Parity/test umbrella: everything a non-shipping A/B run needs (currently
# just cubecl). Never enable in a release build.
parity-tests = ["cubecl"]
rccl = ["rocm"]
# Public test shims (device::gptq_test_shim) letting tests/ exercise the
# GPTQ fused dequant-GEMM launchers without widening the production API.
gpu-test-shims = []

# Phase 5d: Charon MoE backward (training-only). Gates the backward JIT kernel
# source + its device_routing launchers/verifiers so the inference binary skips
# compiling/launching a 245-LOC training kernel it never calls. Opt-in: the
# device-verifier tests run with `cargo test --features training`.
training = []

# ── Quant variant feature gates ─────────────────────────────────────────────
# Each gate controls one quant family's kernel modules, their wmma/charon/moe
# siblings, and the corresponding HsaoKernelCache wiring. All gates default OFF
# so the crate compiles lean in `--no-default-features` mode and each variant
# can be opt-in verified independently (cargo check --features q4k,q5k,fp8).
#
# Families present in src/kernels/mod.rs and src/kernels/{family}/*.rs:
#   q2k, q3k, q4k, q5k, q6k, q8_0, iq2/iq3/iq4, fp8, mxfp4, mxfp8
# Each gate enables the same set of submodules for that family:
#   - {family}_gemm          (fused forward + backward, where present)
#   - {family}_dequant        (standalone dequant, where present)
#   - charon sibling:        charon.rs emits grim_moe_fused_grouped_{variant}
#   - wmma sibling:          wmma_gemm.rs emits grim_fused_dequant_gemm_wmma_{variant}
#   - cache type:            HsaoKernelCache registers the variant's KERNEL_SOURCE
#                            via kernels::source_asm / kernels::jit_cache
#                            (no additional gate needed — registration is in mod.rs)
# Parity check (see docs/VERIFICATION_QUANT_PARITY.md):
#   for each enabled feature F:
#     1. src/kernels/mod.rs has `#[cfg(feature = "F")]` pub mod {family}
#     2. src/kernels/{family}/*.rs compiles (cargo check --features F)
#     3. charon.rs emits the {variant} kernel symbol for that family
#     4. wmma_gemm.rs emits the {variant} wmma symbol for that family
#     5. HsaoKernelCache key includes the {variant} marker (source_asm assembly)
#   end
#
# Families without a dedicated gate today (present in mod.rs, always-on):
#   q8_0_dequant — kept unconditionally because Q8_0 is the KV-cache dequant
#                    default path (kernels::kv_dequant_attention hardcodes q8_0 byte
#                    layout and the test suite exercises it as the baseline).
#   fp8_standalone + fp8_gemm_rdna4 — kept unconditionally because fp8 is a
#                    first-class compute dtype (E4M3) with native MFMA on gfx1200
#                    and the charon forward/backward paths reference fp8 symbols
#                    unconditionally.
#   mxfp4_gemm + mxfp_standalone — kept unconditionally because mxfp4 is the
#                    primary 4-bit training/inference dtype on RDNA4 and charon
#                    emits grim_moe_fused_grouped_mxfp4 unconditionally.
#   iq_dequant + iq_gemm — kept unconditionally because IQ-family dequant kernels
#                    are the crowd-tier baseline for Q2_XXS/Q3_XXS/Q4_XXS and the
#                    test suite exercises them in parity tests.
# Rationale: gating q8_0/fp8/mxfp4/iq would require auditing every caller that
# assumes those symbols exist (charon.rs, wmma_gemm.rs, kv_dequant_attention.rs,
# source_asm.rs, jit_cache.rs). The gated families below (q2k/q3k/q4k/q5k/q6k)
# are the isolated GEMM paths with no cross-module symbol dependencies outside
# their own {family} directory, so they're the safe first-cut for feature gating.
q2k = []
q3k = []
q4k = []
q5k = []
q6k = []
# Future gates (not yet wired — listed for parity, not enabled):
# mxfp4 = []
# mxfp8 = []
# fp8 = []
# iq = []
# q8_0 = []

# ── benches/ (was tests/) ───────────────────────────────────────────────
# Timing/probe files moved out of tests/: they are `#[test]`-based probes,
# not criterion benches, so `harness = true` makes libtest run them as
# bench targets and they stay out of `cargo test`'s default run.
# Excluded on purpose: tests/autotune.rs + tests/perf_gate.rs (pure CPU logic,
# stay in tests/), tests/q4k_dequant_diag.rs + tests/q8_0_diag.rs (genuine
# CPU-oracle parity checks, stay in tests/).

