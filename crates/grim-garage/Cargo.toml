[package]
name = "grim-garage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Grim's Garage — local-first training dashboard & web app (Rust)."

[[bin]]
name = "grim-garage"
path = "src/main.rs"

[dependencies]
grim-format = { workspace = true }
grim-tensor = { workspace = true }
grim-backend-cpu = { workspace = true }
grim-tensor-graph = { workspace = true }
grim-backend-rocm = { workspace = true }
grim-backend-cuda = { workspace = true, optional = true }
grim-backend-vulkan = { workspace = true, optional = true }
grim-backend-metal = { workspace = true, optional = true }
grim-autograd = { workspace = true, features = ["rocm-mem"] }
grim-engine = { workspace = true }
grim-core = { workspace = true }
grim-models-transformer = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Backend HTTP layer (axum)
axum = { version = "0.8" }
tower-http = { version = "0.6", features = ["fs"] }
futures = "0.3"
async-stream = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }
rust-embed = "8"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }

[features]
default = []
# Turn on the CUDA/Vulkan/Metal backend crates AND every GPU backend arm in
# the autograd/nn dispatch layer (`*-mem` features). ROCm + CPU are always
# available (ROCm is grim's primary GPU target). Metal is Apple-only: off
# Linux it compiles but its device is CPU-backed, so it is never *selected*
# as a live GPU here (see backend.rs `probe_metal`).
gpu-selection = [
    "dep:grim-backend-cuda",
    "dep:grim-backend-vulkan",
    "dep:grim-backend-metal",
    "grim-autograd/gpu-selection",
]
