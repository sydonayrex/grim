[package]
name = "grim-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Plugin system for Grim — dynamic library + WASM component loading, ABI, capability flags. §6 of Grim architecture."

[dependencies]
grim-tensor = { workspace = true }
grim-core = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = "0.8"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "test-util"] }
libloading = { version = "0.8", optional = true }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"

# WASM runtime for sandboxed plugin execution
# 48.0.7 fixes GHSA br_table misjump (cranelift/aarch64) + component-model
# stream panic advisories (#30-#33).
wasmtime = { version = "48.0.7", features = ["async"], optional = true }

[dev-dependencies]
grim-backend-cpu = { workspace = true }
wat = "1.0"

[features]
default = ["wasm-sandbox"]
wasm-sandbox = ["wasmtime"]
dylib-loading = ["libloading"]

[lints]
workspace = true
