[package]
name = "grim-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Plugin system for Grim — dynamic library + WASM component loading, ABI, capability flags. §6 of Grim architecture."

[dependencies]
grim-tensor = { workspace = true }
grim-core = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = "0.8"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "test-util"] }
libloading = { version = "0.8", optional = true }

# WASM runtime for sandboxed plugin execution
wasmtime = { version = "47", features = ["async"], optional = true }

[dev-dependencies]
grim-backend-cpu = { workspace = true }
wat = "1.0"

[features]
default = []
wasm-sandbox = ["wasmtime"]
dylib-loading = ["libloading"]
