[package]
# Grim fork of cubecl-hip 0.10.0 (see PROVENANCE.md). NOT a verbatim vendor
# copy: this crate carries grim-specific fixes and optimizations on top of
# upstream, so it is published under its own name. Consumers depend on it by
# path (`grim-cl-hip = { path = "../grim-cl-hip" }`); the registry
# `cubecl-hip` never enters the graph.
name = "grim-cl-hip"
# Tracks the upstream base version (cubecl-hip 0.10.0); grim fork changes
# do not bump this — divergence is recorded in PROVENANCE.md.
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "Grim fork of cubecl-hip 0.10.0 (AMD ROCm HIP runtime) with grim-specific fixes"
repository = "https://github.com/tracel-ai/cubecl/tree/main/crates/cubecl-hip"
categories = ["science"]
keywords = ["gpu", "amd", "rocm", "hip"]
readme = "README.md"
publish = false

[lints.rust]
warnings = "warn"
[lints.clippy]
doc_markdown = "warn"
[lints.rustdoc]
broken_intra_doc_links = "warn"
invalid_html_tags = "warn"

[features]
default = [
    "std",
    "cubecl-runtime/default",
    "cubecl-common/default",
    "cubecl-core/default",
]
std = ["cubecl-runtime/std", "cubecl-common/std", "cubecl-core/std"]
rocwmma = []
tracing = [
    "dep:tracing",
    "cubecl-runtime/tracing",
    "cubecl-common/tracing",
    "cubecl-core/tracing",
]

[dependencies]
log = { version = "^0.4.22", default-features = false }
tracing = { version = "^0.1.43", features = ["attributes"], optional = true, default-features = false }
cubecl-common = { version = "0.10.0", features = [
    "compilation-cache",
    "std",
    "hash",
] }
cubecl-core = { version = "0.10.0", default-features = false }
cubecl-cpp = { version = "0.10.0", default-features = false, features = ["hip"] }
# Bind directly to grim's ROCm 7.16 bindings (dep-rename keeps the vendored
# `cubecl_hip_sys::…` import paths valid; the registry 7.2 file does not
# compile against ROCm 7.16 headers).
cubecl-hip-sys = { path = "../grim-hip-sys", package = "grim-hip-sys" }
cubecl-runtime = { version = "0.10.0", default-features = false, features = [
    "channel-mutex",
] }
bytemuck = "1.16.1"
derive-new = { version = "0.7.0", default-features = false }
half = { version = "2.5", default-features = false, features = [
    "alloc",
    "num-traits",
    "serde",
] }
paste = "1"
serde = { version = "1.0.204", default-features = false, features = [
    "derive",
    "alloc",
] }

[dev-dependencies]
cubecl-core = { version = "0.10.0", features = ["export_tests"] }
cubecl-std = { version = "0.10.0", features = ["export_tests"] }
pretty_assertions = "1.4"
test-log = { version = "^0.2", features = ["trace"], default-features = false }
