[package]
name = "grim-nn"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Neural-network modules and weight-loading for Grim — VarBuilder-equivalent, Linear, RmsNorm, RoPE, Embedding."

[dependencies]
grim-tensor = { workspace = true }
grim-backend-cpu = { workspace = true }
grim-backend-cuda = { workspace = true, optional = true }
grim-backend-rocm = { workspace = true }
grim-backend-metal = { workspace = true }
grim-backend-vulkan = { workspace = true }
grim-quant = { workspace = true }
grim-kvtransport = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
parking_lot = { workspace = true }


[features]
# Default: ROCm only. CUDA is optional — enable with --features cuda-mem.
# This avoids requiring the CUDA toolkit/SDK at build time for ROCm-only hosts.
default = ["rocm-mem"]
cuda-mem = ["dep:grim-backend-cuda"]
rocm-mem = []
metal-mem = []
vulkan-mem = []
gpu-selection = ["cuda-mem", "rocm-mem", "metal-mem", "vulkan-mem"]
# R2 — deterministic MoE dispatch (UniEP idea): route tokens through a
# DeterministicTokenMap (conflict-free prefix-sum addressing) so the CPU
# reference and fused GPU mega-kernel share one routing path.
# Produces bitwise-identical output on CPU without rocm-mem; with rocm-mem
# it additionally exercises the GPU persistent-SM mega-kernel.
moe-deterministic-dispatch = []
moe-mega-kernel = ["rocm-mem", "moe-deterministic-dispatch"]

[dev-dependencies]
grim-format = { workspace = true }
tempfile = "3"

[lints]
workspace = true
