[package]
name = "grim-nn"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Neural-network modules and weight-loading for Grim — VarBuilder-equivalent, Linear, RmsNorm, RoPE, Embedding."

[dependencies]
grim-tensor = { workspace = true }
grim-backend-cpu = { workspace = true }
grim-backend-cuda = { workspace = true, optional = true }
grim-backend-rocm = { workspace = true }
grim-backend-metal = { workspace = true }
grim-backend-vulkan = { workspace = true }
grim-quant = { workspace = true }
grim-kvtransport = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
parking_lot = { workspace = true }


[features]
default = ["rocm-mem", "metal-mem", "vulkan-mem"]
cuda-mem = ["dep:grim-backend-cuda"]
rocm-mem = []
metal-mem = []
vulkan-mem = []
gpu-selection = ["cuda-mem", "rocm-mem", "metal-mem", "vulkan-mem"]

[dev-dependencies]
grim-format = { workspace = true }
tempfile = "3"

[lints]
workspace = true
