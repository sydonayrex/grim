[package]
name = "grim-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "HTTP/gRPC serving layer for Grim — OpenAI-compatible endpoints plus native streaming. axum-based."

[dependencies]
grim-tensor = { workspace = true }
grim-core = { workspace = true }
grim-scheduler = { workspace = true }
grim-engine = { workspace = true }
grim-format = { workspace = true }
grim-plugin = { workspace = true }
grim-backend-rocm = { workspace = true }
grim-backend-cuda = { workspace = true, optional = true }
grim-backend-metal = { workspace = true }
grim-backend-vulkan = { workspace = true }
grim-constrain = { workspace = true }
grim-backend-cpu = { workspace = true }
grim-models-transformer = { workspace = true }
grim-disagg = { workspace = true }
thiserror = { workspace = true }
axum = "0.7"
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "time", "macros"] }
tokio-util = { version = "0.7" }
futures = "0.3"
axum-server = { version = "0.8", features = ["tls-rustls"] }
rcgen = "0.12"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tower = "0.5"
wat = "1.0"

[features]
default = []
cuda = ["dep:grim-backend-cuda", "grim-engine/cuda"]
# Enables the wasmtime-backed WASM plugin loader. When disabled,
# `WasmPluginLoader::create_sampler` returns `Unimplemented`; the request-time
# `sampler` field wiring is still exercised by the default-on mock-sampler E2E
# test (`test_chat_completions_routes_through_named_plugin_sampler`).
wasm-sandbox = ["grim-plugin/wasm-sandbox"]