name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check-and-test:
    name: Test Workspace (${{ matrix.target-feature }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target-feature: ["default", "cpu-only"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - name: Cache cargo registry and build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ matrix.target-feature }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ matrix.target-feature }}-
    - name: Check Formatting
      run: cargo fmt --all -- --check
    - name: Clippy Lints
      run: cargo clippy --workspace --all-targets --exclude grim-backend-vulkan --exclude grim-backend-metal --exclude grim-backend-cuda --exclude grim-backend-rocm -- -D warnings
    - name: Run Workspace Tests
      run: cargo test --workspace --exclude grim-backend-vulkan --exclude grim-backend-metal --exclude grim-backend-cuda --exclude grim-backend-rocm --verbose
