# Example training recipe (WI-E6). Load with:
#   grim-cli train --recipe docs/recipes/lora-lfm25.yaml
# Any CLI flag passed explicitly overrides its value here.
recipe_version: 1
name: lora-lfm25-consumer
model: LFM2.5-350M-Q8_0.gguf
dataset.registry_id: wikitext2-sample
training.mode: lora
training.epochs: 1
training.lr: 0.0002
training.rank: 16
training.alpha: 32.0
training.batch_size: 2048
training.gradient_accumulation_steps: 4
training.warmup_steps: 10
training.logging_steps: 1
training.max_grad_norm: 1.0
training.optimizer: adamw
training.scheduler: cosine-warmup
adapter_output: adapter-lfm25.grim.train
